<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecTec - Customer</title>

    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-background: #0E0E0E;
            --color-text-default: #FFFFFF;
            --color-primary: #EAFF96;
            --color-destructor: #FF3737;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0E0E0E',
                        text_default: '#FFFFFF',
                        primary: '#EAFF96',
                        destructor: '#FF3737',
                        input: '#252525',
                    }
                }
            }
        }
    </script>
</head>

<body>
    <header class="flex h-full">
        <aside class="sidebar">
            <div class="user-section">
                <button class="user-btn">
                    <span class="icon">👤</span> User <span class="arrow">⬇</span>
                </button>
            </div>

            <nav class="menu">
                <ul>
                    <li><span class="icon">⏰</span> Recent</li>
                    <a href="/user">
                        <li><span class="icon">👥</span> Users</li>
                    </a>
                    <a href="/customer">
                        <li class="active"><span class="icon">😊</span> Customers</li>
                    </a>
                    <li><span class="icon">🧰</span> Machines</li>
                    <li><span class="icon">🛠️</span> Services</li>
                    <li><span class="icon">⚙️</span> Engines</li>
                </ul>
            </nav>
        </aside>
    </header>

    <main class="flex flex-col w-full itens-center m-20 gap-5">
        <form action="" class="flex flex-col justify-between h-full">
            <div>
                <h1 class="text-center py-5 text-2xl font-bold">Create Customer</h1>
                <div class="flex flex-col gap-2">
                    <div class="flex flex-col px-10 justify-between">
                        <label for="name" class="text-xl font-bold">Name:</label>
                        <input type="text" class="bg-input border-2 rounded-md py-1" />
                    </div>
                    <div class="flex flex-col px-10">
                        <label for="name" class="text-xl font-bold">Cpf:</label>
                        <input type="text" class="bg-input border-2 rounded-md py-1" />
                    </div>
                    <div class="flex flex-col px-10">
                        <label for="name" class="text-xl font-bold">Phone:</label>
                        <input type="text" class="bg-input border-2 rounded-md py-1" />
                    </div>
                    <div class="flex flex-col px-10">
                        <label for="name" class="text-xl font-bold">Email:</label>
                        <input type="text" class="bg-input border-2 rounded-md py-1" />
                    </div>
                    <div class="flex flex-col px-10">
                        <label for="name" class="text-xl font-bold">Address:</label>
                        <input type="text" class="bg-input border-2 rounded-md py-1" />
                    </div>
                </div>
            </div>
            <div class="flex gap-5 justify-center mb-5">
                <button class="bg-primary text-black text-bold px-10 py-2">Create</button>
                <button class="bg-primary text-black text-bold px-10 py-2">Create and New Machines</button>
            </div>
        </form>
    </main>
</body>

</html>
