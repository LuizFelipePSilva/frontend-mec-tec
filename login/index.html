<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecTec - Login</title>

    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./script.js"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-background: #0E0E0E;
            --color-text-default: #FFFFFF;
            --color-primary: #EAFF96;
            --color-destructor: #FF3737;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0E0E0E',
                        text_default: '#FFFFFF',
                        primary: '#EAFF96',
                        destructor: '#FF3737',
                        input: '#252525',
                    }
                }
            }
        }
    </script>
</head>

<body>
    <main class="flex flex-col w-screen items-center justify-center gap-5 bg-black bg-opacity-20">
        <div class="w-96 bg-black">
            <form action="" class="flex flex-col justify-between gap-3">
                <div>
                    <h1 class="text-center py-5 text-2xl font-bold">Login</h1>
                    <div class="flex flex-col gap-2">
                        <div class="flex flex-col px-10 justify-between">
                            <label for="username" class="text-xl font-bold">Username:</label>
                            <input id="username" type="text" class="bg-input border-2 rounded-md py-1" />
                        </div>
                        <div class="flex flex-col px-10">
                            <label for="password" class="text-xl font-bold">Senha:</label>
                            <input id="password" type="password" class="bg-input border-2 rounded-md py-1" />
                        </div>
                    </div>
                </div>
                <div class="flex gap-5 justify-center mb-5">
                    <button onclick="valid(event)" href="/"
                        class="bg-primary text-black text-bold px-10 py-2">Login</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
