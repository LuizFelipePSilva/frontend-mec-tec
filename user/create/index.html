<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MecTec - Usuário</title>

    <link rel="stylesheet" href="/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./script.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-background: #0e0e0e;
        --color-text-default: #ffffff;
        --color-primary: #eaff96;
        --color-destructor: #ff3737;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#0E0E0E",
              text_default: "#FFFFFF",
              primary: "#EAFF96",
              destructor: "#FF3737",
              input: "#252525",
            },
          },
        },
      };
    </script>
  </head>

  <body>
    <header class="flex h-full">
      <aside class="sidebar">
        <div class="user-section">
          <button class="user-btn">
            <span class="icon">👤</span> Usuário <span class="arrow">⬇</span>
          </button>
        </div>

        <nav class="menu">
          <ul>
            <li>
              <a class="w-full" href="../../index.html"
                ><span class="icon">⏰</span> Recente</a
              >
            </li>
            <li>
              <a class="w-full" href="../../user/index.html"
                ><span class="icon">👥</span> Usuários</a
              >
            </li>
            <li>
              <a class="w-full" href="../../customer/index.html"
                ><span class="icon">😊</span> Clientes</a
              >
            </li>
            <li>
              <a class="w-full" href="../../machine/index.html"
                ><span class="icon">🧰</span> Máquinas</a
              >
            </li>
            <li>
              <a class="w-full" href="../../task/index.html"
                ><span class="icon">🛠️</span> Serviços</a
              >
            </li>
            <li>
              <a class="w-full" href="../../piece/peca.html"
                ><span class="icon">🔩</span> Peças</a
              >
            </li>
            <li>
              <a class="w-full" href="../../order/pedidos.html"
                ><span class="icon">🔩</span> Pedido</a
              >
            </li>
          </ul>
        </nav>
      </aside>
    </header>

    <main class="flex flex-col w-full itens-center m-20 gap-5">
      <form action="" class="flex flex-col justify-between h-full">
        <div>
          <h1 class="text-center py-5 text-2xl font-bold">Criar Usuário</h1>
          <div class="flex flex-col gap-2">
            <div class="flex flex-col px-10 justify-between">
              <label for="username" class="text-xl font-bold">Username:</label>
              <input
                id="username"
                type="text"
                class="bg-input border-2 rounded-md py-1"
              />
            </div>
            <div class="flex flex-col px-10">
              <label for="email" class="text-xl font-bold">Email:</label>
              <input
                id="email"
                type="email"
                class="bg-input border-2 rounded-md py-1"
              />
            </div>
          </div>
        </div>
        <div class="flex gap-5 justify-center mb-5">
          <button
            onclick="valid(event)"
            class="bg-primary text-black text-bold px-10 py-2"
          >
            Criar
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
